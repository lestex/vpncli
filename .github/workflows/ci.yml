name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Build
        run: go build ./...

      # -race needs cgo, which is fine here: it only affects the test binary,
      # never what gets released.
      - name: Test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in step with the version developers run locally.
          version: v2.12.2

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  cross-compile:
    name: cross-compile (cgo-free)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      # The single-static-binary promise rests on the SQLite driver being pure
      # Go. If a cgo dependency ever creeps in, this job is what catches it.
      - name: Build every release target
        run: |
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::${platform}"
            GOOS="${platform%/*}" GOARCH="${platform#*/}" go build -o /dev/null .
            echo "::endgroup::"
          done
